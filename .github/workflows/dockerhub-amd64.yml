name: Build AMD64 image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional image tag
        required: false
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-amd64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push linux/amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare image metadata
        id: image
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Repository secret DOCKERHUB_USERNAME is not configured"
            exit 1
          fi
          IMAGE="${DOCKERHUB_USERNAME,,}/new-api"
          TAG=$(printf '%s' "$INPUT_TAG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          if [ -z "$TAG" ]; then
            TAG=latest
          fi
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write summary
        run: |
          {
            echo "### AMD64 image published"
            echo '```text'
            echo "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"
            echo "${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short_sha }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
